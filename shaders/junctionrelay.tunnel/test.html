<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tunnel Shader Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#ccc; font:14px/1.6 monospace; }
#top { display:flex; gap:12px; padding:12px; background:#1a1a1a; border-bottom:1px solid #333; flex-wrap:wrap; align-items:center; }
#top button { background:#0a0; color:#000; border:none; padding:8px 16px; font:bold 14px monospace; cursor:pointer; border-radius:4px; }
#top button:hover { background:#0c0; }
#top button.reset { background:#555; color:#fff; }
#top button.reset:hover { background:#777; }
canvas { width:400px; height:400px; display:block; margin:12px auto; }
#controls { padding:16px 20px; background:#1a1a1a; border-top:1px solid #333; display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:8px 24px; }
.ctrl { display:flex; align-items:center; gap:8px; }
.ctrl label { min-width:110px; font-size:12px; color:#888; }
.ctrl input[type=range] { flex:1; min-width:100px; }
.ctrl .val { min-width:50px; text-align:right; color:#0f0; font-size:12px; }
.ctrl input[type=color] { width:40px; height:28px; border:none; background:none; cursor:pointer; }
</style></head><body>
<div id="top">
  <button onclick="randomize()">Randomize</button>
  <button class="reset" onclick="resetAll()">Reset</button>
  <span id="presets"></span>
</div>
<canvas id="c"></canvas>
<div id="controls"></div>
<script>
const defaults = {
  gridColor:     { type:'color', value:[0,0.85,1] },
  speed:         { min:0, max:2,   step:0.01, value:0.5 },
  gridDensity:   { min:2, max:16,  step:0.1,  value:6 },
  lineWidth:     { min:0.1, max:2, step:0.01, value:0.5 },
  glowIntensity: { min:0, max:2,   step:0.01, value:0.8 },
  rotationSpeed: { min:0, max:0.5, step:0.005,value:0.05 },
  curvature:     { min:0, max:1,   step:0.01, value:0 },
  depthScale:    { min:0.1, max:2, step:0.01, value:0.5 },
  depthOffset:   { min:-5, max:5,  step:0.1,  value:0 },
  originX:       { min:-1, max:1,  step:0.01, value:0 },
  originY:       { min:-1, max:1,  step:0.01, value:0 },
};

const presets = {
  'Neon Grid':     { gridColor:[0,0.85,1], speed:0.5, gridDensity:6, lineWidth:0.5, glowIntensity:0.8, rotationSpeed:0.05, curvature:0, depthScale:0.5, depthOffset:0, originX:0, originY:0 },
  'Red Core':      { gridColor:[1,0.2,0.05], speed:0.9, gridDensity:8, lineWidth:0.4, glowIntensity:1.2, rotationSpeed:0.1, curvature:0.5, depthScale:0.6, depthOffset:1, originX:0.3, originY:-0.2 },
  'Green Conduit': { gridColor:[0.1,1,0.3], speed:0.6, gridDensity:10, lineWidth:0.3, glowIntensity:0.6, rotationSpeed:0.02, curvature:0.3, depthScale:0.4, depthOffset:0, originX:-0.3, originY:0.2 },
  'Synthwave':     { gridColor:[1,0.1,0.7], speed:0.35, gridDensity:5, lineWidth:0.8, glowIntensity:1, rotationSpeed:0.03, curvature:0.2, depthScale:0.5, depthOffset:-1, originX:0, originY:-0.2 },
  'Ghost Wire':    { gridColor:[0.85,0.9,1], speed:0.25, gridDensity:6, lineWidth:0.2, glowIntensity:0.3, rotationSpeed:0.01, curvature:0, depthScale:0.5, depthOffset:0, originX:0.4, originY:0 },
  'Hyperdrive':    { gridColor:[0.5,0.7,1], speed:1.8, gridDensity:4, lineWidth:0.6, glowIntensity:1.8, rotationSpeed:0.15, curvature:0.7, depthScale:1.2, depthOffset:2, originX:-0.2, originY:0.15 },
};

// Deep copy defaults for live state
const uniforms = {};
for (const [k,v] of Object.entries(defaults)) {
  uniforms[k] = { ...v, value: Array.isArray(v.value) ? [...v.value] : v.value };
}

// Build preset buttons
const presetBar = document.getElementById('presets');
for (const name of Object.keys(presets)) {
  const btn = document.createElement('button');
  btn.textContent = name;
  btn.className = 'reset';
  btn.onclick = () => applyPreset(name);
  presetBar.appendChild(btn);
}

// Build controls
const panel = document.getElementById('controls');
const inputs = {};
for (const [name, u] of Object.entries(uniforms)) {
  const row = document.createElement('div');
  row.className = 'ctrl';
  const lbl = document.createElement('label');
  lbl.textContent = name;
  row.appendChild(lbl);

  if (u.type === 'color') {
    const r = Math.round(u.value[0]*255), g = Math.round(u.value[1]*255), b = Math.round(u.value[2]*255);
    const hex = '#' + [r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = hex;
    inp.oninput = () => {
      const h = inp.value;
      u.value = [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
    };
    row.appendChild(inp);
    inputs[name] = inp;
  } else {
    const range = document.createElement('input');
    range.type = 'range'; range.min = u.min; range.max = u.max; range.step = u.step; range.value = u.value;
    const sp = document.createElement('span');
    sp.className = 'val'; sp.textContent = u.value.toFixed(2);
    range.oninput = () => { u.value = parseFloat(range.value); sp.textContent = u.value.toFixed(2); };
    row.appendChild(range);
    row.appendChild(sp);
    inputs[name] = { range, span: sp };
  }
  panel.appendChild(row);
}

function syncUI() {
  for (const [name, u] of Object.entries(uniforms)) {
    if (u.type === 'color') {
      const r = Math.round(u.value[0]*255), g = Math.round(u.value[1]*255), b = Math.round(u.value[2]*255);
      inputs[name].value = '#' + [r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
    } else {
      inputs[name].range.value = u.value;
      inputs[name].span.textContent = u.value.toFixed(2);
    }
  }
}

function randomize() {
  for (const [name, u] of Object.entries(uniforms)) {
    if (u.type === 'color') {
      u.value = [Math.random(), Math.random(), Math.random()];
    } else {
      u.value = u.min + Math.random() * (u.max - u.min);
    }
  }
  syncUI();
}

function resetAll() {
  for (const [name, u] of Object.entries(uniforms)) {
    u.value = Array.isArray(defaults[name].value) ? [...defaults[name].value] : defaults[name].value;
  }
  syncUI();
}

function applyPreset(name) {
  const p = presets[name];
  for (const [k,v] of Object.entries(p)) {
    if (Array.isArray(v)) uniforms[k].value = [...v];
    else uniforms[k].value = v;
  }
  syncUI();
}

// WebGL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; gl.viewport(0,0,canvas.width,canvas.height); }
window.onresize = resize; resize();

const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs = `precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec3 gridColor;
uniform float speed,gridDensity,lineWidth,glowIntensity,rotationSpeed,curvature,depthScale,depthOffset,originX,originY;

void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 uv=(fragCoord-0.5*iResolution.xy)/min(iResolution.x,iResolution.y);
    float rot=iTime*rotationSpeed;
    float cs=cos(rot),sn=sin(rot);
    uv=vec2(uv.x*cs-uv.y*sn,uv.x*sn+uv.y*cs);

    float rStraight=length(uv);
    float depth=depthScale/(rStraight+0.001)+depthOffset;

    float depthNorm=clamp(1.0-depth/10.0,0.0,1.0);
    vec2 ringOffset=vec2(originX,originY)*curvature*depthNorm*0.3;
    vec2 curvedUV=uv-ringOffset;

    float angle=atan(curvedUV.y,curvedUV.x);
    float radius=length(curvedUV);

    float tunnelZ=depth+iTime*speed;
    float tunnelA=angle*gridDensity/3.14159265;

    float distZ=abs(fract(tunnelZ)-0.5)*2.0;
    float distA=abs(fract(tunnelA)-0.5)*2.0;
    float lwScale=clamp(radius*2.5,0.1,1.0);
    float lw=lineWidth*0.08*lwScale;
    float lineZ=1.0-smoothstep(0.0,lw,distZ);
    float lineA=1.0-smoothstep(0.0,lw,distA);
    float gridLine=max(lineZ,lineA);

    float glowFalloff=12.0/max(glowIntensity,0.01);
    float glowZ=exp(-distZ*glowFalloff);
    float glowA=exp(-distA*glowFalloff);
    float glow=max(glowZ,glowA)*glowIntensity*0.4;

    float fade=smoothstep(0.0,0.08,radius)*smoothstep(2.5,0.3,radius);
    float intensity=(gridLine+glow)*fade;
    vec3 col=gridColor*intensity+vec3(gridLine*fade*0.25);
    float alpha=clamp(intensity,0.0,1.0);
    fragColor=vec4(clamp(col,0.0,1.0),alpha);
}

void main(){mainImage(gl_FragColor,gl_FragCoord.xy);}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if (!gl.getShaderParameter(s,gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); } return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const locs = {};
for (const name of ['iResolution','iTime','gridColor','speed','gridDensity','lineWidth','glowIntensity','rotationSpeed','curvature','depthScale','depthOffset','originX','originY']) {
  locs[name] = gl.getUniformLocation(prog, name);
}

function frame(t) {
  gl.uniform2f(locs.iResolution, canvas.width, canvas.height);
  gl.uniform1f(locs.iTime, t/1000);
  const gc = uniforms.gridColor.value;
  gl.uniform3f(locs.gridColor, gc[0], gc[1], gc[2]);
  for (const name of ['speed','gridDensity','lineWidth','glowIntensity','rotationSpeed','curvature','depthScale','depthOffset','originX','originY']) {
    gl.uniform1f(locs[name], uniforms[name].value);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
