<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shader Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#ccc; font:13px/1.5 -apple-system,sans-serif; display:flex; gap:0; height:100vh; }

/* Left: canvas */
#preview { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; min-width:300px; background:#000; }
#preview canvas { border:1px solid #333; }
#preview .meta { color:#666; font-size:11px; margin-top:8px; }

/* Right: properties panel */
#panel { width:320px; background:#1a1a1a; border-left:1px solid #333; display:flex; flex-direction:column; overflow:hidden; }
#panel-header { padding:12px 16px; border-bottom:1px solid #333; }
#panel-header h2 { font-size:14px; color:#fff; margin:0 0 2px; }
#panel-header .desc { font-size:11px; color:#666; }

/* Toolbar */
.toolbar { display:flex; gap:6px; padding:8px 16px; border-bottom:1px solid #333; flex-wrap:wrap; }
.toolbar button { background:#2a2a2a; color:#aaa; border:1px solid #444; padding:4px 10px; font-size:11px; cursor:pointer; border-radius:3px; }
.toolbar button:hover { background:#333; color:#fff; }
.toolbar button.accent { background:#1a6b1a; color:#fff; border-color:#2a8a2a; }
.toolbar button.accent:hover { background:#228b22; }

/* Preset picker */
#preset-section { padding:8px 16px; border-bottom:1px solid #333; }
#preset-section label { font-size:10px; text-transform:uppercase; color:#888; letter-spacing:0.5px; display:block; margin-bottom:4px; }
#preset-section select { width:100%; background:#2a2a2a; color:#ccc; border:1px solid #444; padding:6px 8px; font-size:12px; border-radius:3px; }

/* Scrollable uniform list */
#uniforms { flex:1; overflow-y:auto; padding:12px 16px; }

/* Pass card */
.pass-card { background:#222; border:1px solid #333; border-radius:6px; margin-bottom:10px; }
.pass-card-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid #333; cursor:pointer; }
.pass-card-header span { font-size:12px; font-weight:600; color:#fff; }
.pass-card-body { padding:10px 12px; }

/* Uniform row */
.uniform { margin-bottom:12px; }
.uniform .u-label { font-size:11px; color:#888; margin-bottom:2px; display:block; }
.uniform .u-desc { font-size:10px; color:#555; margin-top:2px; }

/* Slider + number */
.slider-row { display:flex; align-items:center; gap:8px; }
.slider-row input[type=range] { flex:1; }
.slider-row input[type=number] { width:60px; background:#2a2a2a; color:#0f0; border:1px solid #444; padding:3px 6px; font-size:11px; font-family:monospace; border-radius:3px; text-align:right; }

/* Color row */
.color-row { display:flex; align-items:center; gap:8px; }
.color-row input[type=color] { width:36px; height:28px; border:1px solid #444; background:none; cursor:pointer; border-radius:3px; }
.color-row span { font-size:11px; color:#0f0; font-family:monospace; }
</style></head><body>

<div id="preview">
  <canvas id="c" width="400" height="400"></canvas>
  <div class="meta" id="meta"></div>
</div>

<div id="panel">
  <div id="panel-header"><h2 id="title">Loading...</h2><div class="desc" id="desc"></div></div>
  <div class="toolbar">
    <button class="accent" onclick="randomize()">Randomize</button>
    <button onclick="resetAll()">Reset</button>
  </div>
  <div id="preset-section" style="display:none">
    <label>Preset</label>
    <select id="preset-select"><option value="">—</option></select>
  </div>
  <div id="uniforms"></div>
</div>

<script>
let shaderDef = null;
let uniformDefs = [];
let presetDefs = [];
let uniformState = {};
let uniformInputs = {};
let gl, prog, locs = {};

// Load package.json from same directory
async function init() {
  // file:// can't use fetch — need a local HTTP server
  if (window.location.protocol === 'file:') {
    document.getElementById('title').textContent = 'Local Server Required';
    document.getElementById('desc').innerHTML =
      'Open a terminal in this folder and run:<br>' +
      '<code style="background:#222;padding:2px 6px;border-radius:3px;color:#0f0;user-select:all">' +
      'python -m http.server 8080</code><br>' +
      'Then open <a href="http://localhost:8080/test.html" style="color:#4af">localhost:8080/test.html</a>';
    return;
  }

  try {
    const res = await fetch('package.json');
    const pkg = await res.json();
    shaderDef = pkg.junctionrelay;

    document.getElementById('title').textContent = (shaderDef.emoji || '') + ' ' + (shaderDef.displayName || shaderDef.shaderName);
    document.getElementById('desc').textContent = shaderDef.description || '';
    document.getElementById('meta').textContent = shaderDef.shaderName + ' v' + (pkg.version || '?');
    document.title = shaderDef.displayName + ' — Shader Test';

    uniformDefs = shaderDef.uniforms || [];
    presetDefs = shaderDef.presets || [];

    // Init state from defaults
    for (const u of uniformDefs) {
      uniformState[u.name] = Array.isArray(u.default) ? [...u.default] : u.default;
    }

    buildPresets();
    buildUniforms();

    // Load GLSL source
    const pass = (shaderDef.passes && shaderDef.passes[0]) ? shaderDef.passes[0].entry : null;
    if (!pass) { document.getElementById('title').textContent = 'No passes found'; return; }
    const glslRes = await fetch(pass);
    const glslSrc = await glslRes.text();

    initWebGL(glslSrc);
  } catch (e) {
    document.getElementById('title').textContent = 'Error loading package.json';
    console.error(e);
  }
}

function buildPresets() {
  if (presetDefs.length === 0) return;
  const section = document.getElementById('preset-section');
  section.style.display = '';
  const sel = document.getElementById('preset-select');
  for (const p of presetDefs) {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name + (p.default ? ' (default)' : '');
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    const p = presetDefs.find(x => x.name === sel.value);
    if (!p) return;
    applyValues(p.values);
  };
  // Auto-select default
  const def = presetDefs.find(p => p.default);
  if (def) sel.value = def.name;
}

function buildUniforms() {
  const container = document.getElementById('uniforms');

  // Group by pass
  const passMap = new Map();
  for (const u of uniformDefs) {
    const p = u.pass ?? 0;
    if (!passMap.has(p)) passMap.set(p, []);
    passMap.get(p).push(u);
  }

  const passes = Array.from(passMap.entries()).sort((a,b) => a[0] - b[0]);

  for (const [passIdx, unis] of passes) {
    const card = document.createElement('div');
    card.className = 'pass-card';

    const header = document.createElement('div');
    header.className = 'pass-card-header';
    const label = passes.length > 1 ? `PASS ${passIdx + 1} (${unis.length})` : `ALL UNIFORMS (${unis.length})`;
    header.innerHTML = `<span>${label}</span>`;
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'pass-card-body';

    for (const u of unis) {
      const row = document.createElement('div');
      row.className = 'uniform';

      const lbl = document.createElement('span');
      lbl.className = 'u-label';
      lbl.textContent = u.displayName;
      row.appendChild(lbl);

      if (u.type === 'color') {
        const wrap = document.createElement('div');
        wrap.className = 'color-row';
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.value = rgbToHex(uniformState[u.name]);
        const hex = document.createElement('span');
        hex.textContent = inp.value;
        inp.oninput = () => {
          const h = inp.value;
          uniformState[u.name] = [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
          hex.textContent = h;
          clearPreset();
        };
        wrap.appendChild(inp);
        wrap.appendChild(hex);
        row.appendChild(wrap);
        uniformInputs[u.name] = { type:'color', input:inp, hex };
      } else if (u.type === 'float') {
        const wrap = document.createElement('div');
        wrap.className = 'slider-row';
        const min = u.min ?? 0, max = u.max ?? 1;
        const step = (max - min) / 100;
        const range = document.createElement('input');
        range.type = 'range'; range.min = min; range.max = max; range.step = step;
        range.value = uniformState[u.name];
        const num = document.createElement('input');
        num.type = 'number'; num.min = min; num.max = max; num.step = step * 10;
        num.value = uniformState[u.name];
        range.oninput = () => { uniformState[u.name] = parseFloat(range.value); num.value = uniformState[u.name].toFixed(2); clearPreset(); };
        num.oninput = () => { uniformState[u.name] = parseFloat(num.value) || 0; range.value = uniformState[u.name]; clearPreset(); };
        wrap.appendChild(range);
        wrap.appendChild(num);
        row.appendChild(wrap);
        uniformInputs[u.name] = { type:'float', range, num };
      }

      if (u.description) {
        const desc = document.createElement('div');
        desc.className = 'u-desc';
        desc.textContent = u.description;
        row.appendChild(desc);
      }

      body.appendChild(row);
    }

    card.appendChild(body);
    container.appendChild(card);
  }
}

function rgbToHex(arr) {
  if (!Array.isArray(arr) || arr.length < 3) return '#000000';
  return '#' + arr.slice(0,3).map(c => Math.round(Math.max(0,Math.min(1,c))*255).toString(16).padStart(2,'0')).join('');
}

function applyValues(vals) {
  for (const [k,v] of Object.entries(vals)) {
    if (uniformState[k] !== undefined) {
      uniformState[k] = Array.isArray(v) ? [...v] : v;
    }
  }
  syncUI();
}

function syncUI() {
  for (const [name, ctrl] of Object.entries(uniformInputs)) {
    if (ctrl.type === 'color') {
      ctrl.input.value = rgbToHex(uniformState[name]);
      ctrl.hex.textContent = ctrl.input.value;
    } else if (ctrl.type === 'float') {
      ctrl.range.value = uniformState[name];
      ctrl.num.value = Number(uniformState[name]).toFixed(2);
    }
  }
}

function clearPreset() {
  document.getElementById('preset-select').value = '';
}

function randomize() {
  for (const u of uniformDefs) {
    if (u.type === 'color') {
      uniformState[u.name] = [Math.random(), Math.random(), Math.random()];
    } else if (u.type === 'float') {
      const min = u.min ?? 0, max = u.max ?? 1;
      uniformState[u.name] = min + Math.random() * (max - min);
    }
  }
  syncUI();
  clearPreset();
}

function resetAll() {
  for (const u of uniformDefs) {
    uniformState[u.name] = Array.isArray(u.default) ? [...u.default] : u.default;
  }
  syncUI();
  const def = presetDefs.find(p => p.default);
  document.getElementById('preset-select').value = def ? def.name : '';
}

// ── WebGL ──────────────────────────────────────────────────────────────────

function initWebGL(glslSrc) {
  const canvas = document.getElementById('c');
  gl = canvas.getContext('webgl');
  if (!gl) { alert('WebGL not supported'); return; }

  const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;

  // Build uniform declarations
  const uniformDecls = uniformDefs.map(u => {
    if (u.type === 'color') return `uniform vec3 ${u.name};`;
    return `uniform float ${u.name};`;
  }).join('\n');

  const fs = `precision highp float;
uniform vec2 iResolution;
uniform float iTime;
${uniformDecls}

${glslSrc}

void main(){mainImage(gl_FragColor,gl_FragCoord.xy);}`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(s));
    }
    return s;
  }

  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const pLoc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(pLoc);
  gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

  locs.iResolution = gl.getUniformLocation(prog, 'iResolution');
  locs.iTime = gl.getUniformLocation(prog, 'iTime');
  for (const u of uniformDefs) {
    locs[u.name] = gl.getUniformLocation(prog, u.name);
  }

  gl.viewport(0, 0, canvas.width, canvas.height);
  requestAnimationFrame(frame);
}

function frame(t) {
  if (!gl) return;
  const canvas = document.getElementById('c');
  gl.uniform2f(locs.iResolution, canvas.width, canvas.height);
  gl.uniform1f(locs.iTime, t / 1000);

  for (const u of uniformDefs) {
    const v = uniformState[u.name];
    if (u.type === 'color' && Array.isArray(v)) {
      gl.uniform3f(locs[u.name], v[0], v[1], v[2]);
    } else {
      gl.uniform1f(locs[u.name], v);
    }
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

init();
</script></body></html>
