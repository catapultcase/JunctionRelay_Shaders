<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tunnel Shader Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#ccc; font:13px/1.4 monospace; display:flex; height:100vh; }
canvas { flex:1; display:block; }
#controls { width:240px; padding:12px; overflow-y:auto; background:#1a1a1a; border-left:1px solid #333; }
#controls label { display:block; margin:8px 0 2px; font-size:11px; color:#888; }
#controls input[type=range] { width:100%; }
#controls .val { float:right; color:#0f0; }
</style></head><body>
<canvas id="c"></canvas>
<div id="controls"><h3 style="color:#0f0;margin-bottom:12px">Tunnel Uniforms</h3></div>
<script>
const uniforms = {
  gridColor:     { type:'color', value:[0,0.85,1] },
  speed:         { min:0, max:2,   step:0.01, value:0.5 },
  gridDensity:   { min:2, max:16,  step:0.1,  value:6 },
  lineWidth:     { min:0.1, max:2, step:0.01, value:0.5 },
  glowIntensity: { min:0, max:2,   step:0.01, value:0.8 },
  rotationSpeed: { min:0, max:0.5, step:0.005,value:0.05 },
  curvature:     { min:0, max:1,   step:0.01, value:0 },
  depthScale:    { min:0.1, max:2, step:0.01, value:0.5 },
  depthOffset:   { min:-5, max:5,  step:0.1,  value:0 },
  originX:       { min:-1, max:1,  step:0.01, value:0 },
  originY:       { min:-1, max:1,  step:0.01, value:0 },
};

// Build controls
const panel = document.getElementById('controls');
const vals = {};
for (const [name, u] of Object.entries(uniforms)) {
  if (u.type === 'color') {
    const r = Math.round(u.value[0]*255), g = Math.round(u.value[1]*255), b = Math.round(u.value[2]*255);
    const hex = '#' + [r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
    const lbl = document.createElement('label');
    lbl.innerHTML = name;
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = hex;
    inp.oninput = () => {
      const h = inp.value;
      u.value = [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
    };
    panel.appendChild(lbl); panel.appendChild(inp);
  } else {
    const lbl = document.createElement('label');
    const sp = document.createElement('span');
    sp.className = 'val'; sp.textContent = u.value;
    lbl.textContent = name + ' '; lbl.appendChild(sp);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = u.min; inp.max = u.max; inp.step = u.step; inp.value = u.value;
    inp.oninput = () => { u.value = parseFloat(inp.value); sp.textContent = u.value.toFixed(2); };
    panel.appendChild(lbl); panel.appendChild(inp);
    vals[name] = sp;
  }
}

// WebGL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; gl.viewport(0,0,canvas.width,canvas.height); }
window.onresize = resize; resize();

const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs = `precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec3 gridColor;
uniform float speed,gridDensity,lineWidth,glowIntensity,rotationSpeed,curvature,depthScale,depthOffset,originX,originY;

void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 uv=(fragCoord-0.5*iResolution.xy)/min(iResolution.x,iResolution.y);
    float rot=iTime*rotationSpeed;
    float cs=cos(rot),sn=sin(rot);
    uv=vec2(uv.x*cs-uv.y*sn,uv.x*sn+uv.y*cs);

    float rStraight=length(uv);
    float depth=depthScale/(rStraight+0.001)+depthOffset;

    float depthNorm=clamp(1.0-depth/10.0,0.0,1.0);
    vec2 ringOffset=vec2(originX,originY)*curvature*depthNorm*0.3;
    vec2 curvedUV=uv-ringOffset;

    float angle=atan(curvedUV.y,curvedUV.x);
    float radius=length(curvedUV);

    float tunnelZ=depth+iTime*speed;
    float tunnelA=angle*gridDensity/3.14159265;

    float distZ=abs(fract(tunnelZ)-0.5)*2.0;
    float distA=abs(fract(tunnelA)-0.5)*2.0;
    float lwScale=clamp(radius*2.5,0.1,1.0);
    float lw=lineWidth*0.08*lwScale;
    float lineZ=1.0-smoothstep(0.0,lw,distZ);
    float lineA=1.0-smoothstep(0.0,lw,distA);
    float gridLine=max(lineZ,lineA);

    float glowFalloff=12.0/max(glowIntensity,0.01);
    float glowZ=exp(-distZ*glowFalloff);
    float glowA=exp(-distA*glowFalloff);
    float glow=max(glowZ,glowA)*glowIntensity*0.4;

    float fade=smoothstep(0.0,0.08,radius)*smoothstep(2.5,0.3,radius);
    float intensity=(gridLine+glow)*fade;
    vec3 col=gridColor*intensity+vec3(gridLine*fade*0.25);
    float alpha=clamp(intensity,0.0,1.0);
    fragColor=vec4(clamp(col,0.0,1.0),alpha);
}

void main(){mainImage(gl_FragColor,gl_FragCoord.xy);}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if (!gl.getShaderParameter(s,gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); } return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const locs = {};
for (const name of ['iResolution','iTime','gridColor','speed','gridDensity','lineWidth','glowIntensity','rotationSpeed','curvature','depthScale','depthOffset','originX','originY']) {
  locs[name] = gl.getUniformLocation(prog, name);
}

function frame(t) {
  gl.uniform2f(locs.iResolution, canvas.width, canvas.height);
  gl.uniform1f(locs.iTime, t/1000);
  const gc = uniforms.gridColor.value;
  gl.uniform3f(locs.gridColor, gc[0], gc[1], gc[2]);
  for (const name of ['speed','gridDensity','lineWidth','glowIntensity','rotationSpeed','curvature','depthScale','depthOffset','originX','originY']) {
    gl.uniform1f(locs[name], uniforms[name].value);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
