<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shader Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#ccc; font:13px/1.5 -apple-system,sans-serif; display:flex; gap:0; height:100vh; }

/* Left: canvas */
#preview { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; min-width:300px; background:#000; overflow:hidden; }
#preview canvas { border:1px solid #333; image-rendering:pixelated; }
#preview canvas.fit { width:100%; height:auto; max-height:calc(100vh - 60px); object-fit:contain; }
#preview .meta { color:#666; font-size:11px; margin-top:8px; display:flex; gap:16px; }
#preview .fps { color:#0f0; font-family:monospace; font-size:12px; margin-top:6px; }

/* Right: properties panel */
#panel { width:320px; background:#1a1a1a; border-left:1px solid #333; display:flex; flex-direction:column; overflow:hidden; }
#panel-header { padding:12px 16px; border-bottom:1px solid #333; }
#panel-header h2 { font-size:14px; color:#fff; margin:0 0 2px; }
#panel-header .desc { font-size:11px; color:#666; }

/* Toolbar */
.toolbar { display:flex; gap:6px; padding:8px 16px; border-bottom:1px solid #333; flex-wrap:wrap; }
.toolbar button { background:#2a2a2a; color:#aaa; border:1px solid #444; padding:4px 10px; font-size:11px; cursor:pointer; border-radius:3px; }
.toolbar button:hover { background:#333; color:#fff; }
.toolbar button.accent { background:#1a6b1a; color:#fff; border-color:#2a8a2a; }
.toolbar button.accent:hover { background:#228b22; }

/* Display settings */
.display-settings { display:flex; gap:12px; padding:8px 16px; border-bottom:1px solid #333; }
.display-settings .setting { display:flex; flex-direction:column; gap:3px; flex:1; }
.display-settings label { font-size:10px; text-transform:uppercase; color:#888; letter-spacing:0.5px; }
.display-settings select { background:#2a2a2a; color:#ccc; border:1px solid #444; padding:4px 6px; font-size:11px; border-radius:3px; }

/* Preset picker */
#preset-section { padding:8px 16px; border-bottom:1px solid #333; }
#preset-section label { font-size:10px; text-transform:uppercase; color:#888; letter-spacing:0.5px; display:block; margin-bottom:4px; }
#preset-section select { width:100%; background:#2a2a2a; color:#ccc; border:1px solid #444; padding:6px 8px; font-size:12px; border-radius:3px; }

/* Scrollable uniform list */
#uniforms { flex:1; overflow-y:auto; padding:12px 16px; }

/* Pass card */
.pass-card { background:#222; border:1px solid #333; border-radius:6px; margin-bottom:10px; }
.pass-card-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid #333; }
.pass-card-header span { font-size:12px; font-weight:600; color:#fff; }
.pass-card-header button { background:#2a2a2a; color:#aaa; border:1px solid #444; padding:2px 8px; font-size:10px; cursor:pointer; border-radius:3px; }
.pass-card-header button:hover { background:#333; color:#fff; }
.pass-card-body { padding:10px 12px; }

/* Uniform row */
.uniform { margin-bottom:12px; }
.uniform .u-label-row { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.uniform .u-label { font-size:11px; color:#888; }
.uniform .u-desc { font-size:10px; color:#555; margin-top:2px; }
.lock-btn { background:none; border:none; cursor:pointer; font-size:13px; padding:0; line-height:1; opacity:0.35; }
.lock-btn:hover { opacity:0.7; }
.lock-btn.locked { opacity:1; }

/* Slider + number */
.slider-row { display:flex; align-items:center; gap:8px; }
.slider-row input[type=range] { flex:1; }
.slider-row input[type=number] { width:60px; background:#2a2a2a; color:#0f0; border:1px solid #444; padding:3px 6px; font-size:11px; font-family:monospace; border-radius:3px; text-align:right; }

/* Color row */
.color-row { display:flex; align-items:center; gap:8px; }
.color-row input[type=color] { width:36px; height:28px; border:1px solid #444; background:none; cursor:pointer; border-radius:3px; }
.color-row span { font-size:11px; color:#0f0; font-family:monospace; }
</style></head><body>

<div id="preview">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="fps" id="fps">-- FPS</div>
  <div class="meta" id="meta"></div>
</div>

<div id="panel">
  <div id="panel-header"><h2 id="title">Loading...</h2><div class="desc" id="desc"></div></div>
  <div class="toolbar">
    <button class="accent" onclick="randomize()">Randomize All</button>
    <button onclick="resetAll()">Reset</button>
  </div>
  <div class="display-settings">
    <div class="setting">
      <label>Display Size</label>
      <select id="display-select" onchange="setDisplaySize(this.value)">
        <option value="fit">Fit to panel</option>
        <option value="400x400">400 x 400</option>
        <option value="512x512">512 x 512</option>
        <option value="640x360">640 x 360</option>
        <option value="854x480">854 x 480</option>
        <option value="1280x720" selected>1280 x 720</option>
        <option value="1920x1080">1920 x 1080</option>
      </select>
    </div>
    <div class="setting">
      <label>Render Resolution</label>
      <select id="render-select" onchange="setRenderResolution(this.value)">
        <option value="320x180">320 x 180</option>
        <option value="640x360">640 x 360</option>
        <option value="854x480">854 x 480</option>
        <option value="1280x720" selected>1280 x 720</option>
        <option value="1920x1080">1920 x 1080</option>
      </select>
    </div>
    <div class="setting">
      <label>FPS Target</label>
      <select id="fps-target-select" onchange="setFpsTarget(this.value)">
        <option value="0">Uncapped</option>
        <option value="30">30 FPS</option>
        <option value="60" selected>60 FPS</option>
        <option value="custom">Custom</option>
      </select>
      <input type="number" id="fps-custom" min="1" max="240" value="60" style="display:none; width:60px; background:#2a2a2a; color:#0f0; border:1px solid #444; padding:3px 6px; font-size:11px; font-family:monospace; border-radius:3px; text-align:right; margin-top:3px;" oninput="setFpsTarget('custom')">
    </div>
  </div>
  <div id="preset-section" style="display:none">
    <label>Preset</label>
    <select id="preset-select"><option value="">—</option></select>
  </div>
  <div id="uniforms"></div>
</div>

<script>
let shaderDef = null;
let uniformDefs = [];
let presetDefs = [];
let uniformState = {};
let uniformInputs = {};
let lockedUniforms = new Set();

// Multi-pass state
let gl;
let passDefs = [];      // { program, locs, uniformNames[], fbo, texture }
let quadBuf = null;

// FPS tracking
let fpsFrameCount = 0;
let fpsLastTime = 0;
const fpsEl = () => document.getElementById('fps');

// FPS target — 0 = uncapped, >0 = cap to that value
let fpsTarget = 60;
let fpsMinFrameTime = 1000 / 60; // ms per frame
let lastFrameTime = 0;
let lastRenderedTime = 0;
let renderedFrameCount = 0;
let accumulator = 0;

// Reset timing on tab visibility change to prevent huge delta on resume
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    lastFrameTime = 0;
    accumulator = 0;
  }
});

// Resolve shader path from ?path= query param or current directory
const params = new URLSearchParams(window.location.search);
const shaderName = params.get('path') || '';
const shaderPath = shaderName ? `shaders/${shaderName}` : '.';

async function init() {
  if (window.location.protocol === 'file:') {
    document.getElementById('title').textContent = 'Local Server Required';
    document.getElementById('desc').innerHTML =
      'Run <code style="background:#222;padding:2px 6px;border-radius:3px;color:#0f0;user-select:all">' +
      'python serve.py</code> from the <code>shaders/</code> directory.';
    return;
  }

  try {
    const res = await fetch(`${shaderPath}/package.json`);
    const pkg = await res.json();
    shaderDef = pkg.junctionrelay;

    document.getElementById('title').textContent = (shaderDef.emoji || '') + ' ' + (shaderDef.displayName || shaderDef.shaderName);
    document.getElementById('desc').textContent = shaderDef.description || '';
    document.getElementById('meta').textContent = shaderDef.shaderName + ' v' + (pkg.version || '?');
    document.title = shaderDef.displayName + ' — Shader Test';

    uniformDefs = shaderDef.uniforms || [];
    presetDefs = shaderDef.presets || [];

    for (const u of uniformDefs) {
      uniformState[u.name] = Array.isArray(u.default) ? [...u.default] : u.default;
    }

    buildPresets();
    buildUniforms();

    const passes = shaderDef.passes || [];
    if (passes.length === 0) { document.getElementById('title').textContent = 'No passes found'; return; }

    // Load all pass GLSL sources
    const glslSources = [];
    for (const pass of passes) {
      const glslRes = await fetch(`${shaderPath}/${pass.entry}`);
      glslSources.push(await glslRes.text());
    }

    // Apply initial display size from dropdown
    setDisplaySize(document.getElementById('display-select').value);
    initWebGL(glslSources);
  } catch (e) {
    document.getElementById('title').textContent = 'Error loading shader';
    document.getElementById('desc').textContent = e.message;
    console.error(e);
  }
}

function buildPresets() {
  if (presetDefs.length === 0) return;
  const section = document.getElementById('preset-section');
  section.style.display = '';
  const sel = document.getElementById('preset-select');
  for (const p of presetDefs) {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name + (p.default ? ' (default)' : '');
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    const p = presetDefs.find(x => x.name === sel.value);
    if (!p) return;
    applyValues(p.values);
  };
  const def = presetDefs.find(p => p.default);
  if (def) sel.value = def.name;
}

function buildUniforms() {
  const container = document.getElementById('uniforms');
  const passMap = new Map();
  for (const u of uniformDefs) {
    const p = u.pass ?? 0;
    if (!passMap.has(p)) passMap.set(p, []);
    passMap.get(p).push(u);
  }

  const passes = Array.from(passMap.entries()).sort((a,b) => a[0] - b[0]);

  for (const [passIdx, unis] of passes) {
    const card = document.createElement('div');
    card.className = 'pass-card';

    const header = document.createElement('div');
    header.className = 'pass-card-header';

    const passInfo = shaderDef.passes && shaderDef.passes[passIdx];
    const passName = passInfo ? passInfo.displayName : `Pass ${passIdx + 1}`;
    const label = passes.length > 1 ? `${passName} (${unis.length})` : `ALL UNIFORMS (${unis.length})`;
    const labelSpan = document.createElement('span');
    labelSpan.textContent = label;
    header.appendChild(labelSpan);

    // Per-card randomize button
    const randBtn = document.createElement('button');
    randBtn.textContent = 'Randomize';
    randBtn.onclick = (e) => {
      e.stopPropagation();
      randomizePass(passIdx);
    };
    header.appendChild(randBtn);

    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'pass-card-body';

    for (const u of unis) {
      const row = document.createElement('div');
      row.className = 'uniform';

      const labelRow = document.createElement('div');
      labelRow.className = 'u-label-row';
      const lockBtn = document.createElement('button');
      lockBtn.className = 'lock-btn';
      lockBtn.textContent = '\uD83D\uDD13';
      lockBtn.title = 'Lock from randomize';
      lockBtn.onclick = () => {
        if (lockedUniforms.has(u.name)) {
          lockedUniforms.delete(u.name);
          lockBtn.textContent = '\uD83D\uDD13';
          lockBtn.className = 'lock-btn';
        } else {
          lockedUniforms.add(u.name);
          lockBtn.textContent = '\uD83D\uDD12';
          lockBtn.className = 'lock-btn locked';
        }
      };
      const lbl = document.createElement('span');
      lbl.className = 'u-label';
      lbl.textContent = u.displayName;
      labelRow.appendChild(lockBtn);
      labelRow.appendChild(lbl);
      row.appendChild(labelRow);

      if (u.type === 'color') {
        const wrap = document.createElement('div');
        wrap.className = 'color-row';
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.value = rgbToHex(uniformState[u.name]);
        const hex = document.createElement('span');
        hex.textContent = inp.value;
        inp.oninput = () => {
          const h = inp.value;
          uniformState[u.name] = [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
          hex.textContent = h;
          clearPreset();
        };
        wrap.appendChild(inp);
        wrap.appendChild(hex);
        row.appendChild(wrap);
        uniformInputs[u.name] = { type:'color', input:inp, hex };
      } else if (u.type === 'float') {
        const wrap = document.createElement('div');
        wrap.className = 'slider-row';
        const min = u.min ?? 0, max = u.max ?? 1;
        const step = (max - min) / 100;
        const range = document.createElement('input');
        range.type = 'range'; range.min = min; range.max = max; range.step = step;
        range.value = uniformState[u.name];
        const num = document.createElement('input');
        num.type = 'number'; num.min = min; num.max = max; num.step = step * 10;
        num.value = uniformState[u.name];
        range.oninput = () => { uniformState[u.name] = parseFloat(range.value); num.value = uniformState[u.name].toFixed(2); clearPreset(); };
        num.oninput = () => { uniformState[u.name] = parseFloat(num.value) || 0; range.value = uniformState[u.name]; clearPreset(); };
        wrap.appendChild(range);
        wrap.appendChild(num);
        row.appendChild(wrap);
        uniformInputs[u.name] = { type:'float', range, num };
      }

      if (u.description) {
        const desc = document.createElement('div');
        desc.className = 'u-desc';
        desc.textContent = u.description;
        row.appendChild(desc);
      }

      body.appendChild(row);
    }

    card.appendChild(body);
    container.appendChild(card);
  }
}

function rgbToHex(arr) {
  if (!Array.isArray(arr) || arr.length < 3) return '#000000';
  return '#' + arr.slice(0,3).map(c => Math.round(Math.max(0,Math.min(1,c))*255).toString(16).padStart(2,'0')).join('');
}

function applyValues(vals) {
  for (const [k,v] of Object.entries(vals)) {
    if (uniformState[k] !== undefined) {
      uniformState[k] = Array.isArray(v) ? [...v] : v;
    }
  }
  syncUI();
}

function syncUI() {
  for (const [name, ctrl] of Object.entries(uniformInputs)) {
    if (ctrl.type === 'color') {
      ctrl.input.value = rgbToHex(uniformState[name]);
      ctrl.hex.textContent = ctrl.input.value;
    } else if (ctrl.type === 'float') {
      ctrl.range.value = uniformState[name];
      ctrl.num.value = Number(uniformState[name]).toFixed(2);
    }
  }
}

function clearPreset() {
  document.getElementById('preset-select').value = '';
}

function randomize() {
  for (const u of uniformDefs) {
    if (lockedUniforms.has(u.name)) continue;
    if (u.type === 'color') {
      uniformState[u.name] = [Math.random(), Math.random(), Math.random()];
    } else if (u.type === 'float') {
      const min = u.min ?? 0, max = u.max ?? 1;
      uniformState[u.name] = min + Math.random() * (max - min);
    }
  }
  syncUI();
  clearPreset();
}

function randomizePass(passIdx) {
  for (const u of uniformDefs) {
    if ((u.pass ?? 0) !== passIdx) continue;
    if (lockedUniforms.has(u.name)) continue;
    if (u.type === 'color') {
      uniformState[u.name] = [Math.random(), Math.random(), Math.random()];
    } else if (u.type === 'float') {
      const min = u.min ?? 0, max = u.max ?? 1;
      uniformState[u.name] = min + Math.random() * (max - min);
    }
  }
  syncUI();
  clearPreset();
}

function setDisplaySize(val) {
  const canvas = document.getElementById('c');
  if (val === 'fit') {
    canvas.classList.add('fit');
    canvas.style.width = '';
    canvas.style.height = '';
  } else {
    canvas.classList.remove('fit');
    const [w, h] = val.split('x').map(Number);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
}

function setRenderResolution(val) {
  const [w, h] = val.split('x').map(Number);
  const canvas = document.getElementById('c');
  // Preserve CSS display size — setting canvas.width resets inline styles
  const cssW = canvas.style.width;
  const cssH = canvas.style.height;
  const hasFit = canvas.classList.contains('fit');
  canvas.width = w;
  canvas.height = h;
  if (hasFit) {
    canvas.classList.add('fit');
  } else if (cssW) {
    canvas.style.width = cssW;
    canvas.style.height = cssH;
  } else {
    // No explicit display size set — apply current display selection
    setDisplaySize(document.getElementById('display-select').value);
  }
  if (gl) {
    gl.viewport(0, 0, w, h);
    // Rebuild FBOs for intermediate passes
    for (let i = 0; i < passDefs.length - 1; i++) {
      const pass = passDefs[i];
      if (pass.fbo) {
        gl.deleteFramebuffer(pass.fbo);
        gl.deleteTexture(pass.texture);
      }
      const result = createFBO(w, h);
      pass.fbo = result.fbo;
      pass.texture = result.texture;
    }
  }
}

function setFpsTarget(val) {
  const customInput = document.getElementById('fps-custom');
  if (val === 'custom') {
    customInput.style.display = '';
    fpsTarget = parseInt(customInput.value) || 60;
  } else {
    customInput.style.display = 'none';
    fpsTarget = parseInt(val) || 0;
  }
  fpsMinFrameTime = fpsTarget > 0 ? 1000 / fpsTarget : 0;
}

function resetAll() {
  for (const u of uniformDefs) {
    uniformState[u.name] = Array.isArray(u.default) ? [...u.default] : u.default;
  }
  syncUI();
  const def = presetDefs.find(p => p.default);
  document.getElementById('preset-select').value = def ? def.name : '';
}

// ── WebGL Multi-Pass ────────────────────────────────────────────────────────

function initWebGL(glslSources) {
  const canvas = document.getElementById('c');
  gl = canvas.getContext('webgl');
  if (!gl) { alert('WebGL not supported'); return; }

  const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;

  // Shared quad buffer
  quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

  // Build a program for each pass
  for (let i = 0; i < glslSources.length; i++) {
    const passUniforms = uniformDefs.filter(u => (u.pass ?? 0) === i);
    const uniformDecls = passUniforms.map(u => {
      if (u.type === 'color') return `uniform vec3 ${u.name};`;
      return `uniform float ${u.name};`;
    }).join('\n');

    // Pass 1+ can read iChannel0 (previous pass output)
    const samplerDecl = i > 0 ? 'uniform sampler2D iChannel0;\n' : '';

    // WebGL 1 uses texture2D(), not texture() — rewrite for compatibility
    const glslCompat = glslSources[i].replace(/\btexture\s*\(/g, 'texture2D(');

    const fs = `precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float iTimeDelta;
uniform int iFrame;
${samplerDecl}${uniformDecls}

${glslCompat}

void main(){mainImage(gl_FragColor,gl_FragCoord.xy);}`;

    const program = createProgram(vs, fs, i);
    if (!program) continue;

    gl.useProgram(program);

    // Cache uniform locations
    const passLocs = {};
    passLocs.iResolution = gl.getUniformLocation(program, 'iResolution');
    passLocs.iTime = gl.getUniformLocation(program, 'iTime');
    passLocs.iTimeDelta = gl.getUniformLocation(program, 'iTimeDelta');
    passLocs.iFrame = gl.getUniformLocation(program, 'iFrame');
    if (i > 0) {
      passLocs.iChannel0 = gl.getUniformLocation(program, 'iChannel0');
    }
    for (const u of passUniforms) {
      passLocs[u.name] = gl.getUniformLocation(program, u.name);
    }

    // Create FBO for all passes except the last (last renders to screen)
    let fbo = null, texture = null;
    if (i < glslSources.length - 1) {
      const fboResult = createFBO(canvas.width, canvas.height);
      fbo = fboResult.fbo;
      texture = fboResult.texture;
    }

    passDefs.push({
      program,
      locs: passLocs,
      uniformNames: passUniforms.map(u => u.name),
      fbo,
      texture
    });
  }

  gl.viewport(0, 0, canvas.width, canvas.height);
  requestAnimationFrame(frame);
}

function createProgram(vsSrc, fsSrc, passIndex) {
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(`Pass ${passIndex} shader compile error:`, gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vsShader = compile(gl.VERTEX_SHADER, vsSrc);
  const fsShader = compile(gl.FRAGMENT_SHADER, fsSrc);
  if (!vsShader || !fsShader) return null;

  const prog = gl.createProgram();
  gl.attachShader(prog, vsShader);
  gl.attachShader(prog, fsShader);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(`Pass ${passIndex} link error:`, gl.getProgramInfoLog(prog));
    return null;
  }
  return prog;
}

function createFBO(w, h) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  return { fbo, texture };
}

function frame(t) {
  if (!gl || passDefs.length === 0) return;

  // First frame or returning from background tab — reset timing baseline
  if (lastFrameTime === 0) {
    lastFrameTime = t;
    lastRenderedTime = t;
    requestAnimationFrame(frame);
    return;
  }

  // Clamp frameTime to 250ms to prevent spiral of death after tab switch / GC pause
  const frameTime = Math.min(t - lastFrameTime, 250);
  lastFrameTime = t;

  // FPS target — accumulator pattern (carries remainder forward to prevent drift)
  if (fpsMinFrameTime > 0) {
    accumulator += frameTime;
    if (accumulator < fpsMinFrameTime) {
      requestAnimationFrame(frame);
      return;
    }
    accumulator -= fpsMinFrameTime;
    // Cap accumulator at one frame to prevent catch-up burst
    if (accumulator > fpsMinFrameTime) accumulator = fpsMinFrameTime;
  }

  // Compute shader time uniforms
  const iTime = t / 1000.0;
  const rawDelta = (t - lastRenderedTime) / 1000.0;
  const iTimeDelta = Math.min(rawDelta, 0.1); // Clamp to 100ms max for feedback stability
  const iFrame = renderedFrameCount;
  lastRenderedTime = t;
  renderedFrameCount++;

  // FPS counter — update every 500ms
  fpsFrameCount++;
  if (t - fpsLastTime >= 500) {
    const fps = (fpsFrameCount / ((t - fpsLastTime) / 1000)).toFixed(1);
    const targetLabel = fpsTarget > 0 ? ` / ${fpsTarget} target` : ' / uncapped';
    fpsEl().textContent = fps + ' FPS' + targetLabel;
    fpsFrameCount = 0;
    fpsLastTime = t;
  }

  const canvas = document.getElementById('c');
  const w = canvas.width, h = canvas.height;

  for (let i = 0; i < passDefs.length; i++) {
    const pass = passDefs[i];
    const isLast = i === passDefs.length - 1;

    // Bind FBO or screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, isLast ? null : pass.fbo);
    gl.viewport(0, 0, w, h);

    gl.useProgram(pass.program);

    // Bind quad
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    const pLoc = gl.getAttribLocation(pass.program, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    // Set built-in uniforms
    gl.uniform2f(pass.locs.iResolution, w, h);
    gl.uniform1f(pass.locs.iTime, iTime);
    if (pass.locs.iTimeDelta) gl.uniform1f(pass.locs.iTimeDelta, iTimeDelta);
    if (pass.locs.iFrame) gl.uniform1i(pass.locs.iFrame, iFrame);

    // Bind previous pass texture as iChannel0
    if (i > 0 && pass.locs.iChannel0 !== undefined) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, passDefs[i - 1].texture);
      gl.uniform1i(pass.locs.iChannel0, 0);
    }

    // Set pass uniforms
    for (const name of pass.uniformNames) {
      const u = uniformDefs.find(x => x.name === name);
      const v = uniformState[name];
      if (u.type === 'color' && Array.isArray(v)) {
        gl.uniform3f(pass.locs[name], v[0], v[1], v[2]);
      } else {
        gl.uniform1f(pass.locs[name], v);
      }
    }

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  requestAnimationFrame(frame);
}

init();
</script></body></html>
